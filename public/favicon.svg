<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E2A4"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8E6A26"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D1117"/>
      <stop offset="100%" stop-color="#140609"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,3" opacity="0.8"/>
  <!-- Central Stylized AR monogram -->
  <text x="60" y="68" font-family="'Cinzel', 'Playfair Display', serif" font-size="34" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">AR</text>
  <!-- Decorative crown/bindi dots -->
  <circle cx="60" cy="32" r="3" fill="url(#goldGrad)"/>
  <circle cx="52" cy="35" r="1.8" fill="url(#goldGrad)"/>
  <circle cx="68" cy="35" r="1.8" fill="url(#goldGrad)"/>
  <!-- Arch curve -->
  <path d="M 40 82 Q 60 90 80 82" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.9"/>
  <circle cx="60" cy="87" r="1.8" fill="url(#goldGrad)"/>
</svg>